<!doctype html>
<html lang="en" data-theme="light">
  <head>
	  <meta charset="utf-8" />
	  <meta name="viewport" content="width=device-width, initial-scale=1" />
	  <meta name="text-scale" content="scale" />
    <meta name="msvalidate.01" content="E5CD603A2AABF1659ECAC8A20B150AF4" />
    <meta name="google-site-verification" content="stgZ0EgaRyzVG51NhE0E5bPN58eQCozkWeO7ftJ9dx4" />
    <meta name='impact-site-verification' value='b548e7f5-79f0-4c17-b1e6-aea7e476e7dd'>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fff6f3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#181818" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />
    <link rel="alternate" type="application/rss+xml" title="RSS Feed" href="/rss.xml" />
	  <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Roboto+Serif:ital,opsz,wght@0,8..144,100..900;1,8..144,100..900&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          const savedTheme = localStorage.getItem("theme");
          const theme =
            savedTheme === "light" || savedTheme === "dark"
              ? savedTheme
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
      (function () {
        try {
          const savedLang = localStorage.getItem("lang");
          if (savedLang)
            document.documentElement.setAttribute("lang", savedLang);
        } catch (e) {}
      })();
    </script>
	  %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
	  <div class="bg-base-200">%sveltekit.body%</div>
  </body>
</html>
